name: Build (Android)

on:
    workflow_dispatch:
    pull_request:
        branches: [ "main" ]
    workflow_call:
        inputs:
            release:
                description: "Build in Release mode and produce release artifacts"
                required: false
                type: boolean
                default: false

concurrency:
    group: build-android-arm64-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: gradle

          - name: Set NDK path
            run: |
                # The GitHub Action ubuntu-latest runner comes with a default NDK.
                # We use ANDROID_NDK_LATEST_HOME to point to it.
                echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

          - name: Cache Android Dependencies
            uses: actions/cache@v4
            with:
                path: third_party_android
                key: android-deps-v1-${{ hashFiles('android/androiddeps.sh', 'android/app/src/main/cpp/CMakeLists.txt') }}
                restore-keys: android-deps-

          - name: Install System Dependencies
            run: |
                sudo apt update
                sudo apt install -y cmake ninja-build python3
            shell: bash

          - name: Build C/C++ third-party dependencies
            run: |
                cd android
                bash androiddeps.sh
            shell: bash

          - name: Build Android Release APK
            run: |
                cd android
                chmod +x ./gradlew
                ./gradlew assembleRelease
            shell: bash

          - name: Upload Unsigned Release APK
            uses: actions/upload-artifact@v4
            with:
                name: 3sx-android-release-unsigned
                path: android/app/build/outputs/apk/release/app-release-unsigned.apk
                if-no-files-found: warn

          - name: Save build output (local act)
            if: ${{ always() && env.ACT }}
            run: |
                echo "✅ Android build done!"
