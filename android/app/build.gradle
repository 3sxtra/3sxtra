
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goodport.sxdroid'
    compileSdk = 36

    defaultConfig {
        applicationId "com.goodport.sxdroid"
        minSdk = 24
        targetSdk = 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags ''
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
                targets "main"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildFeatures {
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // SDL3 Java sources — SDLActivity, etc.
            java.srcDirs += '../../third_party_android/sdl3-src/android-project/app/src/main/java'
            assets.srcDirs += "$buildDir/generated/assets/core"
            jniLibs.srcDirs += 'src/main/jniLibs'
        }
    }
    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
            version = '3.22.1'
        }
    }
    aaptOptions {
        noCompress 'AFS'
    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

tasks.register('copyShaders', Copy) {
    from '../../src/shaders'
    into "$buildDir/generated/assets/core/shaders"
    include '*.es'
    include '*.frag'
    include '*.vert'
    include '*.spv'
}

tasks.register('copyCoreAssets', Copy) {
    from '../../assets'
    into "$buildDir/generated/assets/core"
    include 'fonts/**'
    include 'ui/**'
    include 'controllers/**'
    include 'flags/**'
    include 'bezels/**'
    include 'flags_icons/**'
    include 'gamecontrollerdb.txt'
    include 'ASSET_VERSION'
}

tasks.register('copyLibretroShaders', Copy) {
    from '../../third_party/slang-shaders'
    into "$buildDir/generated/assets/core/shaders/libretro"
    include '**/*.slangp'
    include '**/*.slang'
    include '**/*.inc'
    include '**/*.h'
    include '**/*.glsl'
}

tasks.register('copyCustomShaders', Copy) {
    from '../../assets/shaders/custom'
    into "$buildDir/generated/assets/core/shaders/libretro/custom"
}

// Generate a manifest listing all .slangp presets (SDL_GlobDirectory doesn't work on APK assets)
tasks.register('generateShaderManifest') {
    dependsOn 'copyLibretroShaders'
    dependsOn 'copyCustomShaders'
    doLast {
        def libretroDir = file("$buildDir/generated/assets/core/shaders/libretro")
        def manifest = file("$buildDir/generated/assets/core/shaders/libretro/shader_manifest.txt")
        def lines = []
        if (libretroDir.exists()) {
            libretroDir.eachFileRecurse { f ->
                if (f.name.endsWith('.slangp')) {
                    lines << libretroDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                }
            }
        }
        lines.sort()
        manifest.text = lines.join('\n') + '\n'
        println "Generated shader manifest with ${lines.size()} presets"
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn copyShaders
        dependsOn copyCoreAssets
        dependsOn copyLibretroShaders
        dependsOn copyCustomShaders
        dependsOn generateShaderManifest
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
